<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="810" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">CBR: durable job state, bounded model context</title><desc id="desc">The model sees a working set. The full evidence and job history remain outside it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#567986"/></marker></defs><rect width="1100" height="810" fill="#f7f8f4"/><text x="40" y="45" font-family="Arial,sans-serif" font-size="28" fill="#244452" font-weight="700">CBR: durable job state, bounded model context</text><text x="40" y="78" font-family="Arial,sans-serif" font-size="17" fill="#244452">The model sees a working set. The full evidence and job history remain outside it.</text><path d="M195 220V275" fill="none" stroke="#567986" stroke-width="2" marker-end="url(#arrow)"/><path d="M350 344H395" fill="none" stroke="#567986" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 344H750" fill="none" stroke="#567986" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 412V449H195V479" fill="none" stroke="#567986" stroke-width="2" marker-end="url(#arrow)"/><path d="M905 412V479" fill="none" stroke="#567986" stroke-width="2" marker-end="url(#arrow)"/><path d="M1060 558H1080V165H1060" fill="none" stroke="#567986" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="110" width="1020" height="110" rx="12" fill="#e8f0f6" stroke="#aabfc2"/><text x="58" y="140" font-family="Arial,sans-serif" font-size="20" fill="#244452" font-weight="700">Durable state: survives a model context reset</text><text x="58" y="169" font-family="Arial,sans-serif" font-size="16" fill="#244452">Goal and constraints · source/view basis · supported findings · unresolved dependencies</text><text x="58" y="193" font-family="Arial,sans-serif" font-size="16" fill="#244452">Evidence references · pending work · actual tool/model outcomes · budget consumed</text><rect x="40" y="275" width="310" height="137" rx="12" fill="#e4eee5" stroke="#aabfc2"/><text x="58" y="305" font-family="Arial,sans-serif" font-size="20" fill="#244452" font-weight="700">Assemble working set</text><text x="58" y="334" font-family="Arial,sans-serif" font-size="16" fill="#244452">Select relevant sources</text><text x="58" y="358" font-family="Arial,sans-serif" font-size="16" fill="#244452">Include mandatory constraints</text><text x="58" y="382" font-family="Arial,sans-serif" font-size="16" fill="#244452">Keep tool exchanges valid</text><rect x="395" y="275" width="310" height="137" rx="12" fill="#e4eee5" stroke="#aabfc2"/><text x="413" y="305" font-family="Arial,sans-serif" font-size="20" fill="#244452" font-weight="700">Admit this call</text><text x="413" y="334" font-family="Arial,sans-serif" font-size="16" fill="#244452">Count full serialized input</text><text x="413" y="358" font-family="Arial,sans-serif" font-size="16" fill="#244452">Reserve output + safety</text><text x="413" y="382" font-family="Arial,sans-serif" font-size="16" fill="#244452">Check job and tool budgets</text><rect x="750" y="275" width="310" height="137" rx="12" fill="#e4eee5" stroke="#aabfc2"/><text x="768" y="305" font-family="Arial,sans-serif" font-size="20" fill="#244452" font-weight="700">Model + scoped tools</text><text x="768" y="334" font-family="Arial,sans-serif" font-size="16" fill="#244452">Fixed call or short iteration</text><text x="768" y="358" font-family="Arial,sans-serif" font-size="16" fill="#244452">Read bounded evidence</text><text x="768" y="382" font-family="Arial,sans-serif" font-size="16" fill="#244452">Propose a finding or packet</text><rect x="40" y="479" width="310" height="157" rx="12" fill="#f5eddc" stroke="#aabfc2"/><text x="58" y="509" font-family="Arial,sans-serif" font-size="20" fill="#244452" font-weight="700">If it does not fit</text><text x="58" y="538" font-family="Arial,sans-serif" font-size="16" fill="#244452">Narrow or partition the job</text><text x="58" y="562" font-family="Arial,sans-serif" font-size="16" fill="#244452">Checkpoint and repack</text><text x="58" y="586" font-family="Arial,sans-serif" font-size="16" fill="#244452">Or report missing capacity</text><text x="58" y="610" font-family="Arial,sans-serif" font-size="16" fill="#244452">No silent constraint removal</text><rect x="395" y="479" width="665" height="157" rx="12" fill="#f5eddc" stroke="#aabfc2"/><text x="413" y="509" font-family="Arial,sans-serif" font-size="20" fill="#244452" font-weight="700">Validate and commit observable progress</text><text x="413" y="538" font-family="Arial,sans-serif" font-size="16" fill="#244452">Mechanical checks + scoped semantic evaluation</text><text x="413" y="562" font-family="Arial,sans-serif" font-size="16" fill="#244452">Record new findings, sources and unresolved questions</text><text x="413" y="586" font-family="Arial,sans-serif" font-size="16" fill="#244452">Continue with a fresh bounded working set when needed</text><text x="413" y="610" font-family="Arial,sans-serif" font-size="16" fill="#244452">Finish, pause or report incomplete coverage</text><text x="40" y="744" font-family="Arial,sans-serif" font-size="17" fill="#244452">A larger context window buys capacity; it does not establish correctness or complete understanding.</text><text x="40" y="769" font-family="Arial,sans-serif" font-size="17" fill="#244452">Source-backed artifacts and retrieval reduce loss. Tests must measure remaining omissions and drift.</text></svg>