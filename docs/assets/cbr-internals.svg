<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="830" viewBox="0 0 1100 830" role="img" aria-labelledby="title desc"><title id="title">CBR: memory source → useful context</title><desc id="desc">Proposed internals. One CBR service; Comreton remains the project authority.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#627987"/></marker></defs><rect width="1100" height="830" fill="#f6f7f3"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="29" fill="#233d4b" font-weight="700">CBR: memory source → useful context</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="17" fill="#233d4b">Proposed internals. One CBR service; Comreton remains the project authority.</text><path d="M195 198V242" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><path d="M905 198V242" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><path d="M350 299H395" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 299H750" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><path d="M905 356V406" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 463H705" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><path d="M395 463H350" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><path d="M195 520V575" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><path d="M905 520V575" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="110" width="1020" height="88" rx="10" fill="#e1eee9" stroke="#aabdbf"/><text x="58" y="140" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">Comreton or standalone authority</text><text x="58" y="167" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Selects view, work scope and reliance policy. CBR records that authority; it does not replace it.</text><rect x="40" y="242" width="310" height="114" rx="10" fill="#e8eff5" stroke="#aabdbf"/><text x="58" y="272" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">1. Seal evidence</text><text x="58" y="299" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Exact bytes + provenance</text><text x="58" y="322" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Code / environment / scope</text><rect x="395" y="242" width="310" height="114" rx="10" fill="#e8eff5" stroke="#aabdbf"/><text x="413" y="272" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">2. Propose and validate</text><text x="413" y="299" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Typed patches; recorded output</text><text x="413" y="322" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Human, importer or model</text><rect x="750" y="242" width="310" height="114" rx="10" fill="#e8eff5" stroke="#aabdbf"/><text x="768" y="272" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">3. Commit memory source</text><text x="768" y="299" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Immutable revisions + conflicts</text><text x="768" y="322" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Parent and authority checks</text><rect x="750" y="406" width="310" height="114" rx="10" fill="#f4edda" stroke="#aabdbf"/><text x="768" y="436" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">4. Build derived views</text><text x="768" y="463" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Indexes + readable pages</text><text x="768" y="486" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Manifest + coverage frontier</text><rect x="395" y="406" width="310" height="114" rx="10" fill="#f4edda" stroke="#aabdbf"/><text x="413" y="436" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">5. Compile task context</text><text x="413" y="463" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Scope → retrieve → applicability</text><text x="413" y="486" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Budget + omissions + citations</text><rect x="40" y="406" width="310" height="114" rx="10" fill="#f4edda" stroke="#aabdbf"/><text x="58" y="436" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">6. Seal exact packet</text><text x="58" y="463" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Reproducible attempt history</text><text x="58" y="486" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Delivery is separately observed</text><rect x="40" y="575" width="665" height="117" rx="10" fill="#e1eee9" stroke="#aabdbf"/><text x="58" y="605" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">PIO → existing harness</text><text x="58" y="632" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Delivers at a supported native boundary. Captures actual work.</text><text x="58" y="655" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Compaction control is an adapter capability, never assumed.</text><rect x="750" y="575" width="310" height="117" rx="10" fill="#eee9f1" stroke="#aabdbf"/><text x="768" y="605" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">History stays available</text><text x="768" y="632" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Retained branches pin evidence</text><text x="768" y="655" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Caches can be rebuilt</text><text x="40" y="766" font-family="Arial,sans-serif" font-size="17" fill="#233d4b">Evidence ≠ interpretation ≠ authority. A successful build is not proof of every claim.</text><text x="40" y="792" font-family="Arial,sans-serif" font-size="17" fill="#233d4b">Runtime focus is temporary; committed revisions and delivered packets are historical records.</text></svg>