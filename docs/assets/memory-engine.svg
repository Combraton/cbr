<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="810" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">CBR: two intelligent loops, one durable memory</title><desc id="desc">Confirmed direction; detailed implementation remains a proposal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#567986"/></marker></defs><rect width="1100" height="810" fill="#f7f8f4"/><text x="40" y="45" font-family="Arial,sans-serif" font-size="28" fill="#244452" font-weight="700">CBR: two intelligent loops, one durable memory</text><text x="40" y="78" font-family="Arial,sans-serif" font-size="17" fill="#244452">Confirmed direction; detailed implementation remains a proposal.</text><path d="M280 220V273" fill="none" stroke="#567986" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 220V273" fill="none" stroke="#567986" stroke-width="2" marker-end="url(#arrow)"/><path d="M280 410V466" fill="none" stroke="#567986" stroke-width="2" marker-end="url(#arrow)"/><path d="M780 410V466" fill="none" stroke="#567986" stroke-width="2" marker-end="url(#arrow)"/><path d="M855 466V410" fill="none" stroke="#567986" stroke-width="2" marker-end="url(#arrow)"/><path d="M280 570V620" fill="none" stroke="#567986" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 570V620" fill="none" stroke="#567986" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="110" width="485" height="110" rx="12" fill="#e8f0f6" stroke="#aabfc2"/><text x="58" y="140" font-family="Arial,sans-serif" font-size="20" fill="#244452" font-weight="700">Captured evidence</text><text x="58" y="169" font-family="Arial,sans-serif" font-size="16" fill="#244452">Searches, source spans, edits, tests and decisions</text><text x="58" y="193" font-family="Arial,sans-serif" font-size="16" fill="#244452">Exact sources, scope and capture coverage</text><rect x="575" y="110" width="485" height="110" rx="12" fill="#e8f0f6" stroke="#aabfc2"/><text x="593" y="140" font-family="Arial,sans-serif" font-size="20" fill="#244452" font-weight="700">A request for context</text><text x="593" y="169" font-family="Arial,sans-serif" font-size="16" fill="#244452">Goal + branch/code basis + allowed reads</text><text x="593" y="193" font-family="Arial,sans-serif" font-size="16" fill="#244452">Packet budget + investigation budget</text><rect x="40" y="273" width="485" height="137" rx="12" fill="#e4eee5" stroke="#aabfc2"/><text x="58" y="303" font-family="Arial,sans-serif" font-size="20" fill="#244452" font-weight="700">Memory-maintenance loop</text><text x="58" y="332" font-family="Arial,sans-serif" font-size="16" fill="#244452">Inspect → connect → distill → propose revision</text><text x="58" y="356" font-family="Arial,sans-serif" font-size="16" fill="#244452">Triggered by useful events; bounded jobs</text><text x="58" y="380" font-family="Arial,sans-serif" font-size="16" fill="#244452">No permanently growing conversation</text><rect x="575" y="273" width="485" height="137" rx="12" fill="#e4eee5" stroke="#aabfc2"/><text x="593" y="303" font-family="Arial,sans-serif" font-size="20" fill="#244452" font-weight="700">Request-time context loop</text><text x="593" y="332" font-family="Arial,sans-serif" font-size="16" fill="#244452">Retrieve → check gaps → inspect → compose</text><text x="593" y="356" font-family="Arial,sans-serif" font-size="16" fill="#244452">Uses current artifacts and original evidence</text><text x="593" y="380" font-family="Arial,sans-serif" font-size="16" fill="#244452">Can return honest partial coverage</text><rect x="40" y="466" width="1020" height="104" rx="12" fill="#f5eddc" stroke="#aabfc2"/><text x="58" y="496" font-family="Arial,sans-serif" font-size="20" fill="#244452" font-weight="700">One validated write path and durable memory store</text><text x="58" y="525" font-family="Arial,sans-serif" font-size="16" fill="#244452">Artifact revisions + evidence + job checkpoints + recorded model outputs</text><text x="58" y="549" font-family="Arial,sans-serif" font-size="16" fill="#244452">Project authority remains with Comreton; model proposals do not grant permissions.</text><rect x="40" y="620" width="485" height="80" rx="12" fill="#e8f0f6" stroke="#aabfc2"/><text x="58" y="650" font-family="Arial,sans-serif" font-size="20" fill="#244452" font-weight="700">Reusable artifacts</text><text x="58" y="679" font-family="Arial,sans-serif" font-size="16" fill="#244452">Flow maps, findings, failed approaches</text><rect x="575" y="620" width="485" height="80" rx="12" fill="#e8f0f6" stroke="#aabfc2"/><text x="593" y="650" font-family="Arial,sans-serif" font-size="20" fill="#244452" font-weight="700">Sealed context packets</text><text x="593" y="679" font-family="Arial,sans-serif" font-size="16" fill="#244452">Exact bytes, citations, omissions and basis</text><text x="40" y="744" font-family="Arial,sans-serif" font-size="17" fill="#244452">CBR coordinates memory work. It does not add workflow stages or another canvas level.</text><text x="40" y="769" font-family="Arial,sans-serif" font-size="17" fill="#244452">Routine artifacts can be used under policy; consequential project decisions keep their own authority.</text></svg>