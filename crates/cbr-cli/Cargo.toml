[package]
name = "cbr-cli"
description = "The cbr command: a client of CBR's public protocol over its Unix socket."
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "cbr"
path = "src/main.rs"

[dependencies]
cbr-encoding = { path = "../cbr-encoding" }
cbr-identity = { path = "../cbr-identity" }

[dev-dependencies]
tempfile = "3.27.0"
# The model crash matrix reads the ledger the provider wrote, which is the
# only way to check a counter after the process that held it was killed.
# Already in the tree through the provider; declared here so `tests/` can
# see it.
rusqlite.workspace = true
