[package]
name = "cbr-provider"
description = "CBR's Combraton Protocol provider: core/1 over the stream binding."
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "cbr-provider"
path = "src/main.rs"

[dependencies]
cbr-encoding = { path = "../cbr-encoding" }
rusqlite.workspace = true
# Peer credentials (SO_PEERCRED, getpeereid) and the effective user id, for the
# Unix-socket binding's same-user check. Already in the lockfile via rusqlite.
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"
cbr-encoding = { path = "../cbr-encoding" }
