[package]
name = "cbr-provider"
description = "CBR's Combraton Protocol provider: core/1 over the stream binding."
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "cbr-provider"
path = "src/main.rs"

[dependencies]
cbr-encoding = { path = "../cbr-encoding" }
# M3c is the first milestone in which the provider itself reads a repository:
# it registers a checkout, indexes its tree and compiles packets from it. Up
# to M2 only the client resolved a basis, so neither of these was a provider
# dependency.
cbr-identity = { path = "../cbr-identity" }
cbr-memory = { path = "../cbr-memory" }
rusqlite.workspace = true
# Peer credentials (SO_PEERCRED, getpeereid) and the effective user id, for the
# Unix-socket binding's same-user check. Already in the lockfile via rusqlite.
libc = "0.2.189"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
cbr-encoding = { path = "../cbr-encoding" }
# The crash matrix reads the ledger the provider wrote, which is the only way
# to check a counter after the process that held it was killed. Already in the
# tree as a normal dependency; declared here so `tests/` can see it.
rusqlite.workspace = true
